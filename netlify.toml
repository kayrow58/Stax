[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# The service worker must always be fresh so updates reach phones.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Single-page app: every other address loads the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
